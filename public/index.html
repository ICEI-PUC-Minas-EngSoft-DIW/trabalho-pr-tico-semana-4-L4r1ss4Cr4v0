<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

  <body class="flex">
    <header class="flex">
      <img
        src="https://images.unsplash.com/photo-1567696911980-2eed69a46042?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Foto da Taverna"
      />
      <nav class="menu flex">
        <a href="#popular-drinks">Drinks Populares</a>
        <a href="#catalog">Catálogo</a>
      </nav>
    </header>
    <main class="flex">
      <h1 id="title">Taverna</h1>
      <img id="glass" src="imgs/glass.png" alt="Taça amarela" />
    </main>
    <section id="popular-drinks">
      <h2>Drinks Populares</h2>
      <div class="flex" id="carroussel">
        <img
          src="https://images.unsplash.com/photo-1651877546976-ab61bf889b68?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmVncm9uaXxlbnwwfHwwfHx8Mg%3D%3D"
          alt="Negroni"
        />
        <img
          src="https://images.unsplash.com/photo-1582993232955-39424b2cef01?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Martini"
        />
        <img
          src="https://images.unsplash.com/photo-1655546837806-76a6dd54ee2b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Margarita"
        />
      </div>
    </section>
  </body>
</html>
